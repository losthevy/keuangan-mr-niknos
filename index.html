<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Tracker Mr Niknos</title>
<meta name="theme-color" content="#f6f7f4">
<style>
  :root{
    --bg:#f6f7f4; --card:#ffffff; --ink:#1c2420; --soft:#66716b; --line:#e3e7e1;
    --main:#0f7a5a; --main-soft:#e3f3ec; --warn:#b4540a; --warn-soft:#fdeedd;
    --bad:#b3261e; --bad-soft:#fbe9e7; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{padding:20px 0 12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
  h2{font-size:1rem;margin:0 0 10px}
  .muted{color:var(--soft);font-size:.875rem}
  .who{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--soft)}
  select,input,button{font:inherit;color:inherit}
  select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:46px}
  .who select{width:auto;min-height:40px;padding:6px 10px;font-weight:600;color:var(--ink)}
  select:focus,input:focus,button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .saldo{background:var(--main);color:#fff;border:0;padding:20px}
  .saldo .label{opacity:.85;font-size:.875rem}
  .saldo .num{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .saldo .sub{opacity:.9;font-size:.875rem;margin-top:6px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
  .stat .n{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;padding-bottom:2px}
  .tabs button{flex:1 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--soft);font-weight:600;font-size:.9rem}
  .tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .l{min-width:0}
  .row .t{font-weight:600;overflow-wrap:anywhere}
  .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .in{color:var(--main)} .out{color:var(--bad)}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;margin:3px 4px 0 0;white-space:nowrap}
  .ok{background:var(--main-soft);color:var(--main)}
  .due{background:var(--warn-soft);color:var(--warn)}
  .flat{background:#eef0ec;color:var(--soft)}
  .btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:46px;background:var(--main);color:#fff}
  .btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
  .btn.ghost{background:none;color:var(--soft);padding:6px 8px;min-height:32px;font-size:.8rem;font-weight:500;text-decoration:underline}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,247,244,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
  .bar .wrap{display:flex;gap:10px}
  .bar .btn{flex:1}
  dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px);color:var(--ink)}
  dialog::backdrop{background:rgba(20,30,25,.45)}
  dialog form{padding:20px;display:grid;gap:12px}
  label{display:grid;gap:5px;font-size:.875rem;font-weight:600}
  .acts{display:flex;gap:10px;margin-top:4px}
  .acts .btn{flex:1}
  .note{background:var(--warn-soft);color:#6b3305;border-radius:10px;padding:10px 12px;font-size:.875rem}
  .note.good{background:var(--main-soft);color:#0a4f3b}
  .empty{color:var(--soft);text-align:center;padding:18px 0;font-size:.9rem}
  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center;z-index:9}
  #toast.on{opacity:1}
  .lhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:4px}
  .hide{display:none}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.saldo .num{font-size:1.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cash Tracker Mr Niknos</h1>
      <div class="muted" id="sync">Memuat data...</div>
    </div>
    <label class="who" style="display:flex;font-weight:400">Saya
      <select id="me" aria-label="Pilih nama kamu"></select>
    </label>
  </header>

  <div id="setup" class="note hide">Aplikasi belum tersambung ke Google Sheets. Isi <b>API_URL</b> di bagian atas skrip pada index.html dengan URL Web app dari Apps Script.</div>

  <section class="card saldo">
    <div class="label">Saldo kas tim</div>
    <div class="num" id="saldo">Rp0</div>
    <div class="sub" id="saldoSub"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="ringkas" aria-selected="true">Ringkasan</button>
    <button role="tab" data-tab="lomba" aria-selected="false">Lomba</button>
    <button role="tab" data-tab="utang" aria-selected="false">Utang</button>
    <button role="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
  </nav>

  <main id="view"></main>
</div>

<div class="bar"><div class="wrap">
  <button class="btn alt" id="bKas">+ Kas masuk</button>
  <button class="btn" id="bKeluar">+ Pengeluaran</button>
</div></div>

<dialog id="dKas"><form method="dialog" id="fKas">
  <h2>Catat kas masuk</h2>
  <label>Sumber
    <select name="sumber">
      <option>Potongan dividen</option><option>Hadiah lomba</option>
      <option>Setoran anggota</option><option>Lainnya</option>
    </select></label>
  <label>Jumlah (Rp)<input name="jumlah" inputmode="numeric" autocomplete="off" required placeholder="500.000"></label>
  <label>Keterangan<input name="keterangan" maxlength="120" placeholder="Contoh: dividen juara 2 lomba esai"></label>
  <div class="acts"><button type="button" class="btn alt" data-close>Batal</button><button class="btn" value="ok">Simpan</button></div>
</form></dialog>

<dialog id="dKeluar"><form method="dialog" id="fKeluar">
  <h2>Catat pengeluaran</h2>
  <label>Lomba<select name="lomba_id" id="selLomba"></select></label>
  <label id="lblBaru" class="hide">Nama lomba baru<input name="lomba_baru" maxlength="80" placeholder="Contoh: RECYTAX 2026"></label>
  <label>Jenis
    <select name="jenis"><option>Registrasi</option><option>Transportasi</option><option>Cetak dan berkas</option><option>Konsumsi</option><option>Lainnya</option></select></label>
  <label>Biaya (Rp)<input name="jumlah" inputmode="numeric" autocomplete="off" required placeholder="150.000"></label>
  <label>Dibayar oleh<select name="oleh" id="selOleh"></select></label>
  <label>Keterangan<input name="keterangan" maxlength="120" placeholder="Opsional"></label>
  <div id="prev" class="note good hide"></div>
  <div class="acts"><button type="button" class="btn alt" data-close>Batal</button><button class="btn" value="ok">Simpan</button></div>
</form></dialog>

<div id="toast" role="status"></div>

<script>
/* ====== ISI INI dengan URL Web app Apps Script (berakhiran /exec) ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbzzTwW0NuCCf-VvnJxTIhzEc3alUo423zXvJ9HTZi9T7iTcycAepK8lJXdfplbNkVTOyg/exec";
/* ====================================================================== */

const $ = s => document.querySelector(s);
const rp = n => (n < 0 ? "-Rp" : "Rp") + new Intl.NumberFormat("id-ID").format(Math.abs(Math.round(n || 0)));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const tgl = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" }); };
const num = s => Number(String(s).replace(/[^\d]/g, "")) || 0;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let D = { anggota:["Akbar","Ocid","Psan"], saldo:0, totalMasuk:0, totalDariKas:0, kas:[], lomba:[], pengeluaran:[], utang:[] };
let tab = "ringkas", busy = false;

function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2800); }

async function api(body){
  if (!API_URL) { $("#setup").classList.remove("hide"); $("#sync").textContent = "Belum tersambung"; return false; }
  if (busy) return false;
  busy = true; $("#sync").textContent = body ? "Menyimpan..." : "Memuat data...";
  try {
    // text/plain supaya browser tidak mengirim preflight, yang tidak dilayani Apps Script
    const r = await fetch(API_URL, body ? { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) } : {});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Gagal");
    D = j.data;
    $("#sync").textContent = "Tersinkron " + new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
    render(); return true;
  } catch (e) {
    $("#sync").textContent = "Gagal tersambung";
    toast(e.message === "Failed to fetch" ? "Tidak bisa menghubungi server. Cek koneksi atau URL." : e.message);
    return false;
  } finally { busy = false; }
}

const me = () => $("#me").value;
const lombaNama = id => (D.lomba.find(l => l.id === id) || {}).nama || "Tanpa lomba";
const utangDari = pid => D.utang.filter(u => u.pengeluaran_id === pid);

function chips(x){
  const u = utangDari(x.id);
  if (!u.length) return '<span class="chip flat">Dibayar penuh dari kas</span>';
  return u.map(i => `<span class="chip ${i.status === "Lunas" ? "ok" : "due"}">${esc(i.nama)} ${rp(i.jumlah)} · ${i.status === "Lunas" ? "lunas" : "belum"}</span>`).join("");
}

function rowKeluar(x, showLomba){
  return `<div class="row"><div class="l">
    <div class="t">${esc(x.jenis)}${x.keterangan ? " · " + esc(x.keterangan) : ""}</div>
    <div class="muted">${showLomba ? esc(lombaNama(x.lomba_id)) + " · " : ""}${esc(x.dibayar_oleh)} · ${tgl(x.tanggal)}</div>
    <div class="muted">Dari kas ${rp(x.dari_kas)}${x.kekurangan > 0 ? ", kurang " + rp(x.kekurangan) + " dibagi tiga" : ""}</div>
    <div>${chips(x)}</div>
    <button class="btn ghost" data-del="pengeluaran" data-id="${esc(x.id)}">Hapus</button>
  </div><div class="amt out">-${rp(x.jumlah)}</div></div>`;
}

function vRingkas(){
  const src = {}; D.kas.forEach(k => src[k.sumber] = (src[k.sumber] || 0) + Number(k.jumlah));
  const srcRows = Object.entries(src).sort((a,b) => b[1]-a[1]).map(([s,n]) =>
    `<div class="row"><div class="l"><div class="t">${esc(s)}</div></div><div class="amt in">${rp(n)}</div></div>`).join("");
  const sisa = D.anggota.map(n => [n, D.utang.filter(u => u.nama === n && u.status !== "Lunas").reduce((a,u) => a + Number(u.jumlah), 0)]);
  const aktif = D.lomba.filter(l => l.status !== "Selesai");
  return `
  <div class="grid">
    <div class="card stat"><div class="muted">Total kas masuk</div><div class="n in">${rp(D.totalMasuk)}</div></div>
    <div class="card stat"><div class="muted">Terpakai dari kas</div><div class="n out">${rp(D.totalDariKas)}</div></div>
    <div class="card stat"><div class="muted">Lomba aktif</div><div class="n">${aktif.length}</div></div>
  </div>
  <div class="card"><h2>Sumber kas tim</h2>${srcRows || '<div class="empty">Belum ada kas masuk. Tekan tombol Kas masuk di bawah.</div>'}</div>
  <div class="card"><h2>Utang yang belum lunas</h2>
    ${sisa.map(([n,v]) => `<div class="row"><div class="l"><div class="t">${esc(n)}</div></div><div class="amt ${v ? "out" : ""}">${v ? rp(v) : "Tidak ada"}</div></div>`).join("")}
  </div>
  <div class="card"><h2>Lomba yang sedang diikuti</h2>
    ${aktif.map(l => { const t = D.pengeluaran.filter(x => x.lomba_id === l.id).reduce((a,x) => a + Number(x.jumlah), 0);
      return `<div class="row"><div class="l"><div class="t">${esc(l.nama)}</div></div><div class="amt">${rp(t)}</div></div>`; }).join("") || '<div class="empty">Belum ada lomba aktif.</div>'}
  </div>`;
}

function vLomba(){
  const kartu = l => {
    const xs = D.pengeluaran.filter(x => x.lomba_id === l.id);
    const tot = xs.reduce((a,x) => a + Number(x.jumlah), 0);
    const selesai = l.status === "Selesai";
    return `<div class="card"><div class="lhead"><div><h2 style="margin:0">${esc(l.nama)}</h2>
      <span class="chip ${selesai ? "flat" : "ok"}">${selesai ? "Selesai" : "Aktif"}</span></div><div class="amt">${rp(tot)}</div></div>
      ${xs.map(x => rowKeluar(x, false)).join("") || '<div class="empty">Belum ada pengeluaran.</div>'}
      <div style="margin-top:8px"><button class="btn alt sm" data-lomba="${esc(l.id)}" data-selesai="${selesai ? 0 : 1}">${selesai ? "Aktifkan lagi" : "Tandai selesai"}</button>
      ${xs.length ? "" : `<button class="btn ghost" data-del="lomba" data-id="${esc(l.id)}">Hapus lomba</button>`}</div></div>`;
  };
  const lain = D.pengeluaran.filter(x => !x.lomba_id);
  const urut = [...D.lomba].sort((a,b) => (a.status === "Selesai") - (b.status === "Selesai"));
  return (urut.map(kartu).join("") || '<div class="card empty">Belum ada lomba. Tambahkan lewat tombol Pengeluaran.</div>')
    + (lain.length ? `<div class="card"><h2>Pengeluaran di luar lomba</h2>${lain.map(x => rowKeluar(x, false)).join("")}</div>` : "");
}

function vUtang(){
  const saya = me();
  const item = u => {
    const x = D.pengeluaran.find(p => p.id === u.pengeluaran_id) || {};
    const lunas = u.status === "Lunas", milik = u.nama === saya, talang = u.nama === x.dibayar_oleh;
    return `<div class="row"><div class="l">
      <div class="t">${esc(lombaNama(x.lomba_id))} · ${esc(x.jenis || "")}</div>
      <div class="muted">${talang ? "Bagian sendiri, sudah ditalangi" : "Bayar ke " + esc(x.dibayar_oleh || "-")}${lunas && u.tanggal_lunas ? " · lunas " + tgl(u.tanggal_lunas) : ""}</div>
      <span class="chip ${lunas ? "ok" : "due"}">${lunas ? "Lunas" : "Belum lunas"}</span>
      ${talang ? "" : milik ? `<div style="margin-top:8px"><button class="btn sm ${lunas ? "alt" : ""}" data-utang="${esc(u.id)}" data-lunas="${lunas ? 0 : 1}">${lunas ? "Batalkan lunas" : "Tandai sudah lunas"}</button></div>` : ""}
    </div><div class="amt ${lunas ? "" : "out"}">${rp(u.jumlah)}</div></div>`;
  };
  return `<div class="note good" style="margin-bottom:12px">Status utang hanya bisa diubah oleh pemilik utangnya. Kamu sedang masuk sebagai <b>${esc(saya)}</b>.</div>` +
    D.anggota.map(n => {
      const us = D.utang.filter(u => u.nama === n).sort((a,b) => (a.status === "Lunas") - (b.status === "Lunas"));
      const sisa = us.filter(u => u.status !== "Lunas").reduce((a,u) => a + Number(u.jumlah), 0);
      return `<div class="card"><div class="lhead"><h2 style="margin:0">${esc(n)}</h2><div class="amt ${sisa ? "out" : "in"}">${sisa ? "Sisa " + rp(sisa) : "Lunas semua"}</div></div>
        ${us.map(item).join("") || '<div class="empty">Tidak ada catatan utang.</div>'}</div>`;
    }).join("");
}

function vRiwayat(){
  const all = [
    ...D.kas.map(k => ({ t:k.tanggal, h:`<div class="row"><div class="l"><div class="t">${esc(k.sumber)}${k.keterangan ? " · " + esc(k.keterangan) : ""}</div>
      <div class="muted">Dicatat ${esc(k.dicatat_oleh)} · ${tgl(k.tanggal)}</div><button class="btn ghost" data-del="kas" data-id="${esc(k.id)}">Hapus</button></div><div class="amt in">+${rp(k.jumlah)}</div></div>` })),
    ...D.pengeluaran.map(x => ({ t:x.tanggal, h:rowKeluar(x, true) }))
  ].sort((a,b) => new Date(b.t) - new Date(a.t));
  return `<div class="card"><h2>Semua arus kas</h2>${all.map(a => a.h).join("") || '<div class="empty">Belum ada catatan.</div>'}</div>`;
}

function render(){
  $("#saldo").textContent = rp(D.saldo);
  const sisa = D.utang.filter(u => u.status !== "Lunas").reduce((a,u) => a + Number(u.jumlah), 0);
  $("#saldoSub").textContent = `Masuk ${rp(D.totalMasuk)}, terpakai ${rp(D.totalDariKas)}` + (sisa ? `. Utang antaranggota belum lunas ${rp(sisa)}` : "");
  $("#view").innerHTML = ({ ringkas:vRingkas, lomba:vLomba, utang:vUtang, riwayat:vRiwayat })[tab]();
}

/* ---------- Interaksi ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
});

$("#view").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.utang) { if (await api({ action:"setLunas", id:b.dataset.utang, lunas:b.dataset.lunas === "1" })) toast("Status utang diperbarui"); }
  else if (b.dataset.lomba) { await api({ action:"setLombaStatus", id:b.dataset.lomba, selesai:b.dataset.selesai === "1" }); }
  else if (b.dataset.del) {
    if (b.dataset.sure) { if (await api({ action:"hapus", tipe:b.dataset.del, id:b.dataset.id })) toast("Catatan dihapus"); }
    else { b.dataset.sure = 1; b.textContent = "Tekan lagi untuk hapus"; b.style.color = "var(--bad)"; }
  }
});

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());
document.querySelectorAll('input[name="jumlah"]').forEach(i => i.addEventListener("input", () => {
  const n = num(i.value); i.value = n ? new Intl.NumberFormat("id-ID").format(n) : ""; preview();
}));

function preview(){
  const f = $("#fKeluar"), j = num(f.jumlah.value), p = $("#prev");
  if (!j) { p.classList.add("hide"); return; }
  const dari = Math.min(Math.max(D.saldo, 0), j), kurang = j - dari;
  p.classList.remove("hide"); p.classList.toggle("good", !kurang);
  if (!kurang) { p.textContent = `Kas cukup. Saldo menjadi ${rp(D.saldo - j)}.`; return; }
  const per = Math.floor(kurang / D.anggota.length);
  const lain = D.anggota.filter(n => n !== f.oleh.value).join(" dan ");
  p.textContent = `Kas hanya menutup ${rp(dari)}. Kurang ${rp(kurang)} dibagi tiga, sekitar ${rp(per)} per orang. ${lain} tercatat berutang ke ${f.oleh.value}.`;
}

$("#bKas").onclick = () => { $("#fKas").reset(); $("#dKas").showModal(); };
$("#bKeluar").onclick = () => {
  const f = $("#fKeluar"); f.reset();
  $("#selLomba").innerHTML = D.lomba.filter(l => l.status !== "Selesai").map(l => `<option value="${esc(l.id)}">${esc(l.nama)}</option>`).join("")
    + '<option value="__baru">+ Lomba baru</option><option value="">Tanpa lomba</option>';
  f.oleh.value = me(); toggleBaru(); preview(); $("#dKeluar").showModal();
};
function toggleBaru(){ const baru = $("#selLomba").value === "__baru"; $("#lblBaru").classList.toggle("hide", !baru); $("#fKeluar").lomba_baru.required = baru; }
$("#selLomba").onchange = toggleBaru;
$("#selOleh").onchange = preview;

$("#fKas").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target; const j = num(f.jumlah.value);
  if (!j) return toast("Isi jumlahnya dulu");
  if (await api({ action:"addKas", sumber:f.sumber.value, jumlah:j, keterangan:f.keterangan.value, oleh:me() })) { $("#dKas").close(); toast("Kas masuk tercatat"); }
});
$("#fKeluar").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target; const j = num(f.jumlah.value);
  if (!j) return toast("Isi biayanya dulu");
  const baru = f.lomba_id.value === "__baru";
  if (await api({ action:"addPengeluaran", lomba_id: baru ? "" : f.lomba_id.value, lomba_baru: baru ? f.lomba_baru.value : "",
      jenis:f.jenis.value, jumlah:j, keterangan:f.keterangan.value, oleh:f.oleh.value })) { $("#dKeluar").close(); toast("Pengeluaran tercatat"); }
});

/* ---------- Mulai ---------- */
const opsi = D.anggota.map(n => `<option>${n}</option>`).join("");
$("#me").innerHTML = opsi; $("#selOleh").innerHTML = opsi;
if (D.anggota.includes(store.get("niknos_me"))) $("#me").value = store.get("niknos_me");
$("#me").onchange = () => { store.set("niknos_me", me()); render(); };
render(); api();
document.addEventListener("visibilitychange", () => { if (!document.hidden && !document.querySelector("dialog[open]")) api(); });
</script>
</body>
